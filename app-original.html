html,body{height:100%}
body{margin:0;background:#DDE8E2;display:flex;align-items:center;justify-content:center;font-family:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif}
#stage{position:relative;flex-shrink:0}
#frame{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;border-radius:32px;overflow:hidden;box-shadow:0 0 0 10px #1F2A25,0 24px 60px rgba(20,40,30,.35)}
body{margin:0;background:#F5F7F6}
a{color:#087F5B}a:hover{color:#065F44}
.iae button,.iae input{font-family:inherit}
.iae button:focus-visible,.iae input:focus-visible{outline:3px solid #12966F;outline-offset:2px}
.iae .fld:focus-within{box-shadow:0 0 0 3px rgba(18,150,111,.22)}
.iae .fld input:focus-visible{outline:none}
.iae .scroll{scrollbar-width:none}
.iae .scroll::-webkit-scrollbar{display:none}
.iae input::placeholder{color:#6B7A73}
@keyframes iaeSpin{to{transform:rotate(360deg)}}
@keyframes iaePop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes iaeUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.iae .spin{animation:iaeSpin .8s linear infinite}
.iae .pop{animation:iaePop .5s ease-out both}
.iae .up{animation:iaeUp .22s ease-out both}
@media (prefers-reduced-motion: reduce){.iae .pop,.iae .up{animation:none}}
