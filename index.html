*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#F5F7F6;font-family:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;color:#26332D}
#frame{position:fixed;inset:0;overflow:hidden;background:#F5F7F6}
.iae{position:absolute;inset:0}
.iae button,.iae input,.iae select,.iae textarea{font-family:inherit}
.iae button:focus-visible,.iae input:focus-visible,.iae select:focus-visible,.iae textarea:focus-visible{outline:3px solid #12966F;outline-offset:2px}
a{color:#087F5B}a:hover{color:#065F44}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1 1 auto;overflow-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.hdr{height:60px;flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:0 8px;background:#fff;box-shadow:0 1px 0 #E4EAE7;z-index:2}
.back{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#26332D;cursor:pointer;padding:0}
.hdr .ttl{flex:1 1 auto;min-width:0;font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .hact{width:44px;height:44px;border:0;background:#E8F5EF;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#087F5B;cursor:pointer;padding:0;margin-right:4px}
.hdr .hstep{font-size:12px;font-weight:700;color:#4A5A52;padding:0 10px}
.bric{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif}
.num{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-weight:800;line-height:1}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(38,51,45,.06),0 6px 16px rgba(38,51,45,.06)}
.pad{padding:14px}
.btnp{width:100%;height:76px;border:0;border-radius:16px;background:#087F5B;color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 6px 16px rgba(8,127,91,.28)}
.btnp:active{transform:scale(.99)}
.btnb{flex:1;height:52px;border:0;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;background:#E8F5EF;color:#087F5B}
.btnb.primary{background:#087F5B;color:#fff}
.btnb.danger{background:#FBE4E4;color:#B3363A}
.btnb:disabled{opacity:.5;cursor:not-allowed}
.btnline{height:48px;border:1.5px solid #12966F;background:#fff;color:#087F5B;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%}
.foot{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px;background:#fff;box-shadow:0 -1px 0 #E4EAE7}
.kpi{background:#fff;border:0;border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(38,51,45,.06),0 6px 16px rgba(38,51,45,.06);display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;color:#26332D;text-align:left;font-family:inherit}
.kpi .ki{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.kpi .kv{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-size:30px;font-weight:800;line-height:1}
.kpi .kl{font-size:13px;color:#4A5A52}
.qa{min-height:96px;padding:12px 6px;border:0;border-radius:16px;background:#fff;box-shadow:0 1px 2px rgba(38,51,45,.06),0 6px 16px rgba(38,51,45,.06);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:#26332D;font-size:13px;font-weight:700;line-height:1.2;text-align:center;font-family:inherit}
.qa .qi{width:38px;height:38px;border-radius:12px;background:#E8F5EF;color:#087F5B;display:flex;align-items:center;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%;display:block;flex-shrink:0}
.est-sano{background:#E8F5EF;color:#087F5B}
.est-riesgo{background:#FDF1D3;color:#8A5D00}
.est-critico{background:#FBE4E4;color:#B3363A}
.est-none{background:#EEF2F0;color:#4A5A52}
.dot-sano{background:#12966F}.dot-riesgo{background:#F5B82E}.dot-critico{background:#D64545}.dot-none{background:#8AA79B}
.field{margin-bottom:16px}
.field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px;line-height:1.35}
.field .code{font-size:10.5px;color:#087F5B;font-weight:700;background:#E8F5EF;border-radius:6px;padding:2px 7px;margin-right:7px;vertical-align:middle;white-space:nowrap}
.field .help{font-size:12.5px;color:#4A5A52;line-height:1.45;margin:0 0 8px}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{width:100%;padding:0 13px;height:48px;border:1.5px solid #CBD5D0;border-radius:12px;font-size:16px;background:#fff;color:#26332D;outline:none}
.field textarea{height:auto;min-height:70px;padding:12px 13px;resize:vertical;line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#12966F;box-shadow:0 0 0 3px rgba(18,150,111,.22)}
.field .unit{font-size:11.5px;color:#4A5A52;margin-top:5px}
.field .req{color:#B3363A}
.sev{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.sev button{height:54px;border:1.5px solid #CBD5D0;background:#fff;border-radius:12px;padding:0 2px;font-size:11px;font-weight:700;color:#4A5A52;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;line-height:1.1;min-width:0}
.sev button b{font-size:15px;font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif}
.sev button.on{color:#fff;border-color:transparent}
.sev button.on.s0{background:#8AA79B}.sev button.on.s1{background:#84B84F}.sev button.on.s2{background:#E0A32E}.sev button.on.s3{background:#D9732E}.sev button.on.s4{background:#C0392B}
.checks{display:flex;flex-direction:column;gap:8px}
.check{display:flex;gap:16px;align-items:flex-start;font-size:14.5px;background:#fff;border:1.5px solid #CBD5D0;border-radius:12px;padding:12px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:#087F5B;flex-shrink:0}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle button{height:48px;border:1.5px solid #CBD5D0;background:#fff;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;color:#4A5A52}
.toggle button.on{background:#087F5B;border-color:#087F5B;color:#fff}
.photo{border:1.5px dashed #A9CDBB;border-radius:14px;padding:14px;text-align:center;color:#4A5A52;font-size:13.5px;cursor:pointer;background:#F7FBF9}
.photo img{max-width:100%;border-radius:12px;display:block;margin:0 auto 8px;max-height:180px}
.gps{background:#E6F0F7;border:1px solid #cfe2ef;border-radius:12px;padding:12px;font-size:13.5px;color:#1F5E8A;line-height:1.5}
.gps b{font-size:15px}
.computed{background:#E8F5EF;border-radius:12px;padding:12px;font-size:14px}
.computed b{color:#087F5B;font-size:17px;font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif}
.progress{height:6px;background:#E8F5EF;border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:#087F5B;transition:width .25s}
.alert{border-radius:12px;padding:12px;font-size:13.5px;margin-bottom:12px;line-height:1.5}
.alert.w{background:#FDF1D3;color:#8A5D00}
.alert.d{background:#FBE4E4;color:#B3363A}
.alert.i{background:#E6F0F7;color:#1F5E8A}
.empty{text-align:center;color:#4A5A52;font-size:14px;padding:32px 12px;line-height:1.6}
.secthead{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-size:20px;font-weight:800;margin:0 0 4px}
.sectnote{font-size:13px;color:#4A5A52;line-height:1.5;margin:0 0 16px}
.qlist .qi{display:flex;gap:9px;font-size:13.5px;padding:9px 0;border-bottom:1px solid #EEF2F0;align-items:flex-start}
.qlist .qi:last-child{border:0}
.qlist .ok{color:#087F5B;font-weight:700}.qlist .no{color:#B3363A;font-weight:700}
.big{font-family:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;font-size:40px;font-weight:800;color:#087F5B;text-align:center;line-height:1}
.ivae{display:flex;flex-direction:column;gap:6px}
.ivae .line{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:9px 11px;border-radius:10px;background:#F7FBF9}
.ivae .line span:last-child{font-weight:700;white-space:nowrap}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qbtn{height:50px;min-width:0;padding:0 4px;border-radius:12px;border:1.5px solid #CBD5D0;background:#fff;color:#4A5A52;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700}
.qbtn .n{font-size:13px;white-space:nowrap}
.qbtn .c{font-size:12px;opacity:.85}
.qbtn.on{border-color:#087F5B;background:#E8F5EF;color:#087F5B}
.sbar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 0 6px;background:#EEF2F0}
.sbar span{display:block;height:100%}
.erow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EEF2F0}
.erow .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.erow .lbl{flex:1 1 auto;font-size:14px}
.erow .n{font-size:14px;font-weight:700}
.erow .p{font-size:13px;color:#4A5A52;width:56px;text-align:right}
.brow{padding:10px 0;border-top:1px solid #EEF2F0}
.brow .top{display:flex;justify-content:space-between;gap:8px}
.brow .nm{font-size:14px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sp{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sp i{color:#4A5A52}
.brow .bar{height:8px;border-radius:4px;background:#EEF2F0;overflow:hidden;margin-top:6px}
.brow .bar span{display:block;height:100%;background:#12966F;border-radius:4px}
.badge{font-size:12px;font-weight:700;color:#087F5B;background:#E8F5EF;padding:2px 8px;border-radius:6px;flex-shrink:0}
.mapbox{position:relative;flex-shrink:0;height:360px;border-radius:18px;overflow:hidden;background:#DCEDE3;box-shadow:inset 0 0 0 1px #CFE1D7}
.mapbox .rh{position:absolute;left:0;right:0;top:47%;height:18px;background:#F3F6F4}
.mapbox .rv{position:absolute;top:0;bottom:0;left:40%;width:18px;background:#F3F6F4}
.mzone{position:absolute;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#4A5A52;text-align:center;padding:4px}
.pin{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pin span{border-radius:50%;border:2px solid #fff;display:block}
.legend{display:flex;justify-content:space-between;gap:8px;padding:0 4px;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.rowb{display:flex;gap:8px;align-items:center}
.img2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.img2 img{width:100%;border-radius:10px}
.carrusel{position:relative;height:200px;border-radius:22px;overflow:hidden;background:#E8F5EF;flex-shrink:0}
.carrusel .track{display:flex;height:100%;transition:transform .6s ease}
.carrusel .slide{min-width:100%;height:100%}
.carrusel .slide img{width:100%;height:100%;object-fit:cover;display:block}
.carrusel .dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px}
.carrusel .dots button{width:8px;height:8px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.55);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.carrusel .dots button.on{width:20px;background:#fff}
@media (prefers-reduced-motion: reduce){.carrusel .track{transition:none}}

/* ---------- 3. Almacenamiento ---------- */
const KEY = "iae_registros_v3";
const CONFIG = {DT_MAX:15, AREA_MAX:300};
let records = [];

function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(records)) }catch(e){ alert("No se pudo guardar: el almacenamiento local está lleno. Exporte y libere espacio.") } }
function cargarDatos(){
  let raw=null; try{ raw=localStorage.getItem(KEY) }catch(e){ raw=null }
  if(raw===null){ records=pilotData(); persist(); }
  else { try{ records=JSON.parse(raw)||[] }catch(e){ records=[] } }
}

const esc = s=>String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v=>{ const n=parseFloat(String(v==null?"":v).replace(",",".")); return isNaN(n)?null:n };
const r1 = v=> v==null?null:Math.round(v*10)/10;
const r2 = v=> v==null?null:Math.round(v*100)/100;
const f1 = v=> v==null?"—":r1(v).toFixed(1).replace(".",",");

/* ---------- 5. Cálculos derivados ---------- */
function calcularMedidas(f){
  const es = f.metodo_diam==="CAP" ? "CAP" : "DAP";
  const arr = esArr(f.medidas_fustes).map(num).filter(x=>x!=null);
  const daps = arr.map(x=> es==="CAP" ? x/Math.PI : x);
  const dapEq = daps.length ? Math.sqrt(daps.reduce((a,b)=>a+b*b,0)) : null;
  return {metodo:es, valores:arr, dap_por_fuste:daps, dap_equivalente:dapEq, dap_total:es==="CAP"? (r1(arr.reduce((a,b)=>a+b,0)/Math.PI)) : r1(arr.reduce((a,b)=>a+b,0))};
}
function areaCopa(f){ const a=num(f.copa_ns), b=num(f.copa_eo); if(a==null||b==null) return null; return r1(Math.PI*a*b/4) }
function deltaT(f){
  const sol=[f.tsol1,f.tsol2,f.tsol3].map(num).filter(x=>x!=null);
  const som=[f.tsombra1,f.tsombra2,f.tsombra3].map(num).filter(x=>x!=null);
  if(!sol.length||!som.length) return {dsol:null,dsom:null,dt:null};
  const msol=sol.reduce((a,b)=>a+b,0)/sol.length, msom=som.reduce((a,b)=>a+b,0)/som.length;
  return {dsol:r1(msol), dsom:r1(msom), dt:r1(msol-msom)};
}
function heatIndex(t,hr){
  if(t==null||hr==null) return null;
  const T=t*9/5+32, R=hr;
  let hi=-42.379+2.04901523*T+10.14333127*R-0.22475541*T*R-0.00683783*T*T-0.05481717*R*R+0.00122874*T*T*R+0.00085282*T*R*R-0.00000199*T*T*R*R;
  if(R<13 && T>=80 && T<=112) hi -= ((13-R)/4)*Math.sqrt((17-Math.abs(T-95))/17);
  if(R>85 && T>=80 && T<=87) hi += ((R-85)/10)*((87-T)/5);
  return r1((hi-32)*5/9);
}
const M19 = {
  inminente:["Improbable","Algo probable","Probable","Muy probable"],
  probable:["Improbable","Improbable","Algo probable","Probable"],
  posible:["Improbable","Improbable","Improbable","Algo probable"],
  improbable:["Improbable","Improbable","Improbable","Improbable"]
};
const M20 = {
  "Muy probable":["Bajo","Moderado","Alto","Extremo"],
  "Probable":["Bajo","Moderado","Alto","Alto"],
  "Algo probable":["Bajo","Bajo","Moderado","Moderado"],
  "Improbable":["Bajo","Bajo","Bajo","Bajo"]
};
const IMP = {muy_baja:0, baja:1, media:2, alta:3};
const CON = {despreciables:0, menores:1, significativas:2, severas:3};
function nivelRiesgo(f){
  const pf=M19[f.prob_falla], im=IMP[f.prob_impacto], co=CON[f.consecuencias];
  if(pf==null||im==null||co==null) return null;
  const pi = pf[im];
  return M20[pi][co];
}
function infiltracionOK(f){ return !!f.infiltracion_na || num(f.infiltracion_s)!=null }
function ivae(f){
  const dt=deltaT(f).dt, area=areaCopa(f);
  const dtn = dt==null?null:Math.max(0,Math.min(1,dt/CONFIG.DT_MAX));
  const arn = area==null?null:Math.max(0,Math.min(1,area/CONFIG.AREA_MAX));
  const recn = num(f.reconocen_nombre)==null?null:num(f.reconocen_nombre)/5;
  const rie = {Bajo:0,Moderado:.33,Alto:.67,Extremo:1}[nivelRiesgo(f)];
  const est = {sano:0,leve:.25,moderado:.5,severo:.75,muerto:1}[f.estado_sanitario];
  const sa1=num(f.sitios_agua), sa2=num(f.sitios_larvas);
  const cri = (sa1==null)?null:(sa1===0?0:(sa2>0?1:.5));
  const sistemas = esArr(f.sistemas_agua).filter(x=>x!=="Ninguno").length;
  const agu = sistemas/4;
  const comps=[
    ["Enfriamiento (ΔT)", .20, dtn, "b"],
    ["Sombra útil en recreo", .20, arn, "b"],
    ["Reconocimiento", .10, recn, "b"],
    ["Riesgo", .20, rie, "p"],
    ["Estado sanitario", .15, est, "p"],
    ["Criaderos de mosquitos", .10, cri, "p"],
    ["Afectación a sistemas de agua", .05, agu, "p"]
  ];
  let benef=0, prob=0, faltan=0, out=[];
  comps.forEach(([l,w,v,tipo])=>{
    if(v==null){ faltan++; out.push({l,w,v:null,tipo}); return; }
    const aporte=w*v; if(tipo==="b") benef+=aporte; else prob+=aporte;
    out.push({l,w,v,tipo,aporte});
  });
  return {ivae:r2(benef-prob), benef:r2(benef), prob:r2(prob), detalle:out, faltan};
}
function estadoCategoria(f){
  const e=f.estado_sanitario;
  if(e==="sano") return {t:"Sano",cls:"sano"};
  if(e==="leve"||e==="moderado") return {t:"En riesgo",cls:"riesgo"};
  if(e==="severo"||e==="muerto") return {t:"Crítico",cls:"critico"};
  return {t:"Sin clasificar",cls:"none"};
}
function estStyle(f){
  const c=estadoCategoria(f);
  return {label:c.t,clase:"est-"+c.cls,dot:"dot-"+c.cls};
}
function calidad(f){
  const rows=[];
  const add=(ok,txt)=>rows.push([!!ok,txt]);
  add(f.codigo_arbol,"El código del árbol está generado y coincide con la marcación.");
  add(f.gps && num(f.gps.precision)!=null && num(f.gps.precision)<=5,"Precisión del GPS ≤ 5 m (o justificada en observaciones).");
  add(f.foto_general&&f.foto_fuste&&f.foto_copa&&f.foto_base,"Están las cuatro fotografías básicas.");
  const m=calcularMedidas(f);
  add(m.valores.length>=1,"Se registró al menos una medida de diámetro.");
  const at=num(f.altura_total), af=num(f.altura_fuste), ac=num(f.altura_inicio_copa);
  add(at!=null && (af==null||af<at) && (ac==null||ac<at),"Altura de fuste e inicio de copa menores que la altura total.");
  add(esArr(f.medidas_fustes).length>=num(f.num_fustes||1),"Hay una medida por cada fuste.");
  const dt=deltaT(f).dt; add(dt!=null,"Se registraron las temperaturas de sol y de sombra (ΔT).");
  add(areaCopa(f)!=null,"Se registraron los diámetros de copa y la sombra útil.");
  add(num(f.sitios_agua)!=null && num(f.sitios_larvas)!=null,"Se revisaron los sitios con agua y con larvas.");
  add(esArr(f.sistemas_agua).length>0,"Se revisaron los cuatro grupos de sistemas de agua.");
  add(infiltracionOK(f) && num(f.dias_ultima_lluvia)!=null,"La infiltración registra tiempo y días desde la última lluvia.");
  add(f.estado_sanitario!=null,"El estado sanitario general está asignado.");
  add(nivelRiesgo(f)!=null,"La evaluación de riesgo está completa.");
  add(ivae(f).faltan===0,"Las variables que alimentan el IVAE están completas.");
  return rows;
}

  const pick=a=>a[Math.floor(rnd()*a.length)];
  const shuffle=a=>{ for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1)); const t=a[i];a[i]=a[j];a[j]=t;} return a; };
  const share=(total,n,gen)=>{ const w=[]; for(let i=0;i<n;i++) w.push(gen());
    const s=w.reduce((a,b)=>a+b,0); const raw=w.map(x=>x/s*total); const out=raw.map(Math.floor);
    let rem=total-out.reduce((a,b)=>a+b,0);
    const fr=raw.map((v,i)=>[v-Math.floor(v),i]).sort((a,b)=>b[0]-a[0]);

  for(let i=0;i<128;i++){
    const insId=instArr[i], p=inst(insId), esp=espArr[i], est=estArr[i];

    const dap=dapT[i]/10, alt=altT[i]/10;

    const tSol=r1(38+rnd()*14), tSom=r1(28+rnd()*6);

function siguienteConsecutivo(instId){
  const p = inst(instId)?.prefijo || "IE";
  const usados = records.filter(r=>r.institucion===instId).map(r=>num(r.consecutivo)||0);
  const n = (usados.length?Math.max(...usados):0)+1;
  return {consecutivo:String(n), codigo_arbol:p+"-"+String(n).padStart(4,"0")};
}
function recomputar(f){
  const instId=f.institucion;
  if(instId && !f.__fijado){
    const sc=siguienteConsecutivo(instId);
    if(!f.consecutivo) f.consecutivo=sc.consecutivo;
    f.codigo_arbol=(inst(instId)?.prefijo||"IE")+"-"+String(num(f.consecutivo)||sc.consecutivo).padStart(4,"0");
  }
  const nf=Math.max(1,num(f.num_fustes)||1);
  const arr=esArr(f.medidas_fustes).slice(0,nf);
  while(arr.length<nf) arr.push("");
  f.medidas_fustes=arr;

let carTimer=null, carIdx=0;
function detenerCarrusel(){ if(carTimer && typeof clearInterval==="function"){ clearInterval(carTimer); } carTimer=null; }
function iniciarCarrusel(){
  detenerCarrusel();
  const track=$("#ctrack");
  if(!track || !track.children || !track.children.length) return;
  const dots=[].slice.call(document.querySelectorAll("#carrusel .dots button"));
  const n=track.children.length;
  const pinta=i=>{ carIdx=((i%n)+n)%n; track.style.transform="translateX("+(-carIdx*100)+"%)";
    dots.forEach((d,k)=>{ if(k===carIdx) d.classList.add("on"); else d.classList.remove("on"); }); };
  pinta(0);
  dots.forEach((d,k)=>d.addEventListener("click",()=>pinta(k)));
  const box=$("#carrusel");
  if(box && box.addEventListener){
    let x0=null;
    box.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; },{passive:true});
    box.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) pinta(carIdx+(dx<0?1:-1)); x0=null; },{passive:true});
  }
  const quieto = (typeof matchMedia==="function") && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!quieto && typeof setInterval==="function"){ carTimer=setInterval(()=>pinta(carIdx+1),4000); }
}

/* ---------- 12. Estadísticas ---------- */
function viewStats(){
  const total=records.length;
  const especies=new Set(records.map(r=>r.nombre_comun).filter(Boolean));
  const daps=records.map(r=>calcularMedidas(r).dap_equivalente).filter(x=>x!=null);
  const alts=records.map(r=>num(r.altura_total)).filter(x=>x!=null);
  const dap=daps.length? daps.reduce((a,b)=>a+b,0)/daps.length : null;
  const alt=alts.length? alts.reduce((a,b)=>a+b,0)/alts.length : null;
  const c=catCounts();
  const estados=[["sano","Sano",c.sano,"#12966F"],["riesgo","En riesgo",c.riesgo,"#F5B82E"],["critico","Crítico",c.critico,"#D64545"]];
  const pct=n=>total?r1(n/total*100):0;
  const instRows=INST.map(i=>({nombre:i.nombre,prefijo:i.prefijo,n:records.filter(r=>r.institucion===i.id).length})).filter(x=>x.n>0);
  const maxInst=Math.max(1,...instRows.map(x=>x.n));
  const counts={};
  records.forEach(r=>{ if(r.nombre_comun) counts[r.nombre_comun]=(counts[r.nombre_comun]||0)+1; });
  const sci={}; ESPECIES.forEach(e=>sci[e[0]]=e[1]);
  const top=Object.keys(counts).map(k=>({c:k,s:sci[k]||"",n:counts[k]}))
    .sort((a,b)=> b.n-a.n || b.c.localeCompare(a.c)).slice(0,5);
  const maxTop=Math.max(1,...top.map(x=>x.n));

  let h='<div class="scr">';
  h+=headerBack("Estadísticas","home");

     statCard(total,"Árboles registrados","")+
     statCard(especies.size,"Especies distintas","")+
     statCard(f1(dap),'DAP promedio','<span style="font-size:15px;font-weight:700"> cm</span>')+
     statCard(f1(alt),'Altura promedio','<span style="font-size:15px;font-weight:700"> m</span>')+
     '</div>';
  h+='<section class="card" style="padding:16px">'+
     '<h2 class="bric" style="margin:0;font-size:17px;font-weight:700">Estado fitosanitario</h2>'+
     '<div class="sbar" aria-hidden="true">'+estados.map(e=>'<span style="width:'+pct(e[2])+'%;background:'+e[3]+'"></span>').join("")+'</div>'+
     estados.map(e=>'<div class="erow"><span class="dot" style="background:'+e[3]+'"></span><span class="lbl">'+e[1]+'</span><span class="n">'+e[2]+'</span><span class="p">'+f1(pct(e[2]))+' %</span></div>').join("")+
     '</section>';
  h+='<section class="card" style="padding:16px">'+
     '<h2 class="bric" style="margin:0 0 6px;font-size:17px;font-weight:700">Árboles por institución</h2>'+
     instRows.map(r=>'<div class="brow"><div class="top"><span class="nm">'+esc(r.nombre)+'</span><span class="n" style="font-weight:700">'+r.n+'</span></div>'+
       '<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span class="badge">'+esc(r.prefijo)+'</span>'+
       '<div class="bar" style="flex-grow:1;height:8px;border-radius:4px;background:#EEF2F0;overflow:hidden"><span style="display:block;height:100%;width:'+r1(r.n/maxInst*100)+'%;background:#12966F;border-radius:4px"></span></div></div></div>').join("")+
     '</section>';
  h+='<section class="card" style="padding:16px">'+
     '<h2 class="bric" style="margin:0 0 6px;font-size:17px;font-weight:700">Especies más frecuentes</h2>'+
     top.map(r=>'<div class="brow"><div class="top"><span class="sp"><strong>'+esc(r.c)+'</strong> <i>'+esc(r.s)+'</i></span><span class="n" style="font-weight:700">'+r.n+'</span></div>'+
       '<div class="bar"><span style="width:'+r1(r.n/maxTop*100)+'%"></span></div></div>').join("")+
     '</section>';
  h+='<p style="margin:0;font-size:12px;color:#4A5A52;text-align:center;line-height:1.5">Datos piloto de demostración ('+total+' registros). Restablézcalos o bórrelos desde «Exportar datos».</p>';
  h+='</div></div>';
  return h;
}

function viewWizard(){
  const st=STEPS[state.step], f=state.form;

     '<div style="font-size:11.5px;color:#4A5A52;padding-top:8px">Paso '+(state.step+1)+' de '+STEPS.length+' · '+esc(st.code)+'</div></div>';

  else {

  h+='</div>';
  return h;
}
function fieldHTML(fld,f){
  const val=f[fld.k];
  const code='<span class="code">'+esc(fld.c)+'</span>';
  const help=fld.help?'<p class="help">'+esc(fld.help)+'</p>':'';
  const req=fld.req?' <span class="req">*</span>':'';
  const L='<label>'+code+esc(fld.l)+req+'</label>';
  const u=fld.u?'<div class="unit">Unidad: '+esc(fld.u)+'</div>':'';
  if(fld.t==="text") return '<div class="field">'+L+help+'<input type="text" data-k="'+esc(fld.k)+'" value="'+esc(val)+'"></div>';
  if(fld.t==="num"||fld.t==="int") return '<div class="field">'+L+help+'<input type="number" inputmode="'+(fld.t==="int"?"numeric":"decimal")+'" data-k="'+esc(fld.k)+'" value="'+esc(val)+'"'+(fld.min!=null?' min="'+fld.min+'"':'')+(fld.max!=null?' max="'+fld.max+'"':'')+(fld.step?' step="'+fld.step+'"':'')+'>'+u+'</div>';
  if(fld.t==="time") return '<div class="field">'+L+help+'<input type="time" data-k="'+esc(fld.k)+'" value="'+esc(val)+'"></div>';
  if(fld.t==="select") return '<div class="field">'+L+help+'<select data-k="'+esc(fld.k)+'"><option value="">— Seleccione —</option>'+escSel(fld,val)+'</select></div>';
  if(fld.t==="multi"){
    const arr=esArr(val);
    return '<div class="field">'+L+help+'<div class="checks">'+fld.o.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return '<label class="check"><input type="checkbox" data-multi="'+esc(fld.k)+'" value="'+esc(v)+'"'+(arr.indexOf(v)>=0?" checked":"")+'><span>'+esc(l)+'</span></label>'}).join("")+'</div></div>';
  }
  if(fld.t==="bool") return '<div class="field">'+L+help+'<div class="toggle"><button type="button" data-bool="'+esc(fld.k)+'" data-v="1" class="'+(val===true?"on":"")+'">Sí</button><button type="button" data-bool="'+esc(fld.k)+'" data-v="0" class="'+(val===false?"on":"")+'">No</button></div></div>';
  if(fld.t==="sev") return '<div class="field">'+L+help+'<div class="sev">'+SEV.map(s=>'<button type="button" data-sev="'+esc(fld.k)+'" data-v="'+s[0]+'" class="'+(String(val)===s[0]?"on s"+s[0]:"")+'"><b>'+s[0]+'</b>'+s[1]+'</button>').join("")+'</div></div>';
  if(fld.t==="gps"){
    const g=f.gps||{};
    const txt = g.lat!=null ? ('<b>'+f2(g.lat)+', '+f2(g.lng)+'</b><br>Precisión ±'+f1(g.precision)+' m'+(g.alt!=null?' · Altitud '+f1(g.alt)+' m':'')) : "Sin capturar.";
    return '<div class="field">'+L+help+'<div class="gps">'+txt+'</div><div style="height:8px"></div><button class="btnline" data-a="gps">Capturar coordenadas GPS</button></div>';
  }
  if(fld.t==="photo") return '<div class="field">'+L+help+'<div class="photo" data-photo="'+esc(fld.k)+'">'+(val?'<img src="'+val+'"><span>Cambiar fotografía</span>':"Tocar para tomar o adjuntar la fotografía")+'</div></div>';
  if(fld.t==="fustes"){
    const nf=Math.max(1,esArr(f.medidas_fustes).length);
    let rows=""; for(let i=0;i<nf;i++){ rows+='<div class="rowb" style="margin-bottom:6px"><span class="mono" style="width:74px">Fuste '+(i+1)+'</span><input type="number" step="0.1" inputmode="decimal" style="flex:1;padding:0 12px;height:46px;border:1.5px solid #CBD5D0;border-radius:12px;font-size:16px" data-fuste="'+i+'" value="'+esc(esArr(f.medidas_fustes)[i]||"")+'"></div>'; }
    const m=calcularMedidas(f);
    return '<div class="field">'+L+help+'<div style="font-size:12.5px;color:#4A5A52;margin-bottom:8px">Se registra '+(f.metodo_diam==="CAP"?"CAP":"DAP")+' de cada tronco. Ajuste el número de fustes en DS-02.</div>'+rows+
      '<div class="computed">DAP equivalente: <b>'+f1(m.dap_equivalente)+'</b> cm</div>'+u+'</div>';
  }
  if(fld.t==="auto") return '<div class="field">'+L+help+'<div class="computed">'+esc(val)+'</div></div>';
  if(fld.t==="computed"){
    return '<div class="field">'+L+help+'<div class="computed" data-k="'+esc(fld.k)+'">'+computedVal(f,fld.k)+'</div></div>';
  }
  return "";
}
function computedVal(fm,k){
  if(k==="codigo_arbol") return esc(fm.codigo_arbol||"se asigna al elegir la institución");
  if(k==="nivel_riesgo") return esc(nivelRiesgo(fm)||"complete RG-03, RG-06 y RG-07");
  if(k==="delta_t") return f1(deltaT(fm).dt)+" °C";
  if(k==="indice_calor") return f1(heatIndex(num(fm.t_aire_sol),num(fm.hr_sol)))+" °C (al sol)";
  if(k==="area_sombra"){const a=num(fm.sombra_largo),b=num(fm.sombra_ancho); return (a!=null&&b!=null)?f1(Math.PI*a*b/4)+" m²":"—";}
  if(k==="ocup_prom"){const arr=[fm.ocupacion_1,fm.ocupacion_2,fm.ocupacion_3].map(num).filter(x=>x!=null); return arr.length?(f1(arr.reduce((x,y)=>x+y,0)/arr.length)+" (máx "+Math.max(...arr)+")"):"—";}
  return "—";
}
function resumen(f){

   'Área de copa: <b style="color:#26332D">'+f1(ar)+' m²</b><br>'+
   'ΔT (sol − sombra): <b style="color:#26332D">'+f1(dt.dt)+' °C</b><br>'+
   (hi!=null?'Índice de calor al sol: <b style="color:#26332D">'+f1(hi)+' °C</b><br>':'')+
   'Nivel de riesgo: <b style="color:#26332D">'+esc(r||"—")+'</b><br>'+

  h+='<div class="big">'+(iv.ivae==null?"—":(iv.ivae>0?"+":"")+iv.ivae.toFixed(2))+'</div><div style="color:#4A5A52;font-size:12px;text-align:center;margin-top:6px">Beneficios '+iv.benef.toFixed(2)+' − problemas '+iv.prob.toFixed(2)+(iv.faltan?' · '+iv.faltan+' componente(s) sin datos':'')+'</div>';
  h+='<div class="ivae" style="margin-top:12px">'+iv.detalle.map(d=>'<div class="line"><span>'+esc(d.l)+' ('+Math.round(d.w*100)+'%)</span><span>'+(d.v==null?"Falta":(d.tipo==="b"?"+":"−")+(d.w*d.v).toFixed(3))+'</span></div>').join("")+'</div>';
  h+='<div class="unit" style="margin-top:8px">Pesos provisionales (AHP pendiente). ΔT<sub>máx</sub>='+CONFIG.DT_MAX+' °C y área<sub>máx</sub>='+CONFIG.AREA_MAX+' m² de referencia.</div></div>';
  const cal=calidad(f); const pend=cal.filter(x=>!x[0]).length;
  h+='<div class="card pad" style="margin-bottom:12px"><h3 class="bric" style="margin:0 0 6px;font-size:15px">Control de calidad ('+(cal.length-pend)+'/'+cal.length+')</h3><div class="qlist">'+cal.map(x=>'<div class="qi"><span class="'+(x[0]?"ok":"no")+'">'+(x[0]?"✓":"✗")+'</span><span>'+esc(x[1])+'</span></div>').join("")+'</div></div>';
  if((r==="Alto"||r==="Extremo") || num(f.sitios_larvas)>0 || f.prob_falla==="inminente"){
    h+='<div class="alert w">Atención: informe al docente el mismo día. '+(num(f.sitios_larvas)>0?"Se encontraron sitios con larvas. ":"")+(f.prob_falla==="inminente"?"Falla inminente: aísle la zona e informe a la rectoría. ":"")+((r==="Alto"||r==="Extremo")?"Riesgo "+r+".":"")+'</div>';
  }

  h+='<div class="card pad"><h3 class="bric" style="margin:0 0 6px;font-size:15px">Control de calidad ('+(cal.length-pend)+'/'+cal.length+')</h3><div class="qlist">'+cal.map(x=>'<div class="qi"><span class="'+(x[0]?"ok":"no")+'">'+(x[0]?"✓":"✗")+'</span><span>'+esc(x[1])+'</span></div>').join("")+'</div></div>';

  h+='<div class="foot"><button class="btnb danger" data-a="borrar">Eliminar</button><button class="btnb" data-a="editar">Editar</button><button class="btnb primary" data-a="home">Cerrar</button></div>';
  h+='</div>';
  return h;
}

/* ---------- 15. Exportar ---------- */
function viewExport(){
  let h='<div class="scr">';
  h+=headerBack("Exportar datos","home");
  h+='<div class="scroll" style="padding:16px 16px 24px;display:flex;flex-direction:column;gap:12px">';
  h+='<div class="card pad"><h3 class="bric" style="margin:0 0 6px;font-size:16px">CSV de registros</h3><div style="font-size:13px;color:#4A5A52;line-height:1.5;margin-bottom:10px">Todos los campos del protocolo, listos para la hoja de cálculo del proyecto.</div><div class="rowb"><button class="btnb" style="background:#087F5B;color:#fff" data-a="csv">Descargar CSV</button><button class="btnb" data-a="copiar">Copiar CSV</button></div></div>';
  h+='<div class="card pad"><h3 class="bric" style="margin:0 0 6px;font-size:16px">GeoJSON</h3><div style="font-size:13px;color:#4A5A52;line-height:1.5;margin-bottom:10px">Puntos georreferenciados para el sistema de información geográfica.</div><button class="btnline" data-a="geojson">'+ico("download",18)+' Descargar GeoJSON</button></div>';
  h+='<div class="card pad"><h3 class="bric" style="margin:0 0 6px;font-size:16px">Respaldo completo</h3><div style="font-size:13px;color:#4A5A52;line-height:1.5;margin-bottom:10px">Copia de seguridad en JSON (incluye fotografías y coordenadas).</div><button class="btnline" data-a="backup">'+ico("download",18)+' Descargar respaldo JSON</button></div>';
  h+='<div class="card pad"><h3 class="bric" style="margin:0 0 6px;font-size:16px">Datos piloto</h3><div style="font-size:13px;color:#4A5A52;line-height:1.5;margin-bottom:10px">Esta copia incluye 128 registros de demostración. Puede restablecerlos o borrarlos para iniciar el censo real.</div><div class="rowb"><button class="btnb" data-a="seed">Restablecer piloto</button><button class="btnb danger" data-a="resetall">Borrar todo</button></div></div>';
  h+='<div class="alert i">Los archivos se generan en el dispositivo y no se envían a ningún servidor.</div>';
  h+='</div></div>';
  return h;
}

/* ---------- 16. Exportación ---------- */
function camposPlanos(){
  const cols=[];
  STEPS.forEach(s=>s.fields.forEach(f=>{ if(f.t!=="computed"&&f.t!=="auto"&&f.t!=="photo"&&f.t!=="gps"&&f.k!=="medidas_fustes") cols.push([s.code+" "+f.c,f.k]); }));
  cols.unshift(["ID-06 Código del árbol","__codigo"]);
  cols.push(["ID-07 Latitud","__lat"],["ID-07 Longitud","__lng"],["ID-07 Precisión (m)","__prec"]);
  cols.push(["DS-05 DAP equivalente (cm)","__dap"],["DS-09 Área de copa (m²)","__areacopa"]);
  cols.push(["CT-01 ΔT (°C)","__dt"],["CT-04 Índice de calor (°C)","__ic"],["CT-05 Área de sombra (m²)","__areasombra"]);
  cols.push(["RG-08 Nivel de riesgo","__riesgo"],["FG-02 Categoría","__categoria"],["IVAE","__ivae"],["Calidad (cumple/total)","__calidad"]);
  return cols;
}
function f1n(v){return v==null?"":r1(v)}
function valorPlano(r,k){
  if(k==="__codigo") return r.codigo_arbol||"";
  if(k==="__lat") return r.gps&&r.gps.lat!=null?r.gps.lat:"";
  if(k==="__lng") return r.gps&&r.gps.lng!=null?r.gps.lng:"";
  if(k==="__prec") return r.gps&&r.gps.precision!=null?r.gps.precision:"";
  if(k==="__dap") return r1(calcularMedidas(r).dap_equivalente)??"";
  if(k==="__areacopa") return f1n(areaCopa(r));
  if(k==="__dt") return f1n(deltaT(r).dt);
  if(k==="__ic") return f1n(heatIndex(num(r.t_aire_sol),num(r.hr_sol)));
  if(k==="__areasombra"){const a=num(r.sombra_largo),b=num(r.sombra_ancho);return (a!=null&&b!=null)?r1(Math.PI*a*b/4):"";}
  if(k==="__riesgo") return nivelRiesgo(r)||"";
  if(k==="__categoria") return estadoCategoria(r).t;
  if(k==="__ivae") return r2(ivae(r).ivae)??"";
  if(k==="__calidad"){const c=calidad(r);return (c.filter(x=>x[0]).length)+"/"+c.length;}
  const v=r[k]; if(Array.isArray(v)) return v.join("; ");
  if(v===true) return "Sí"; if(v===false) return "No"; return v==null?"":v;
}
function csv(){
  const cols=camposPlanos();
  const head=cols.map(c=>'"'+c[0].replace(/"/g,'""')+'"').join(",");
  const body=records.map(r=>cols.map(c=>{let v=String(valorPlano(r,c[1]));return '"'+v.replace(/"/g,'""')+'"'}).join(",")).join("\r\n");
  return head+"\r\n"+body;
}
function geojson(){
  return JSON.stringify({type:"FeatureCollection",features:records.filter(r=>r.gps&&r.gps.lat!=null).map(r=>({type:"Feature",geometry:{type:"Point",coordinates:[r.gps.lng,r.gps.lat]},properties:{codigo:r.codigo_arbol,especie:r.nombre_comun,cientifico:r.nombre_cientifico,institucion:inst(r.institucion)?.nombre,dap:r1(calcularMedidas(r).dap_equivalente),altura:num(r.altura_total),riesgo:nivelRiesgo(r),estado:estadoCategoria(r).t,ivae:r2(ivae(r).ivae)}}))},null,2);
}
function descargar(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- 17. Eventos ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-a]"); if(a){ accion(a.dataset.a, a.dataset); return; }
  const f=e.target.closest("[data-filtro]"); if(f){ state.filtro=f.dataset.filtro; state.listLimit=30; render(); return; }
  const mi=e.target.closest("[data-mapinst]"); if(mi){ state.mapInst=mi.dataset.mapinst; state.mapSel=null; render(); return; }
  const ms=e.target.closest("[data-mapsel]"); if(ms){ state.mapSel=ms.dataset.mapsel; render(); return; }
  const op=e.target.closest("[data-open]"); if(op){ state.editId=op.dataset.open; state.screen="detail"; render(); return; }
  const sev=e.target.closest("[data-sev]"); if(sev){ state.form[sev.dataset.sev]=sev.dataset.v; render(); return; }
  const bo=e.target.closest("[data-bool]"); if(bo){ const k=bo.dataset.bool, v=bo.dataset.v==="1"; state.form[k]=v; if(k==="muestra_botanica"&&!v){ state.form.num_colecta=""; state.form.muestra_fertil=null; } render(); return; }
  const ph=e.target.closest("[data-photo]"); if(ph){ elegirFoto(ph.dataset.photo); return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ state.query=t.value; const pos=t.selectionStart; render(); const nq=$("#q"); if(nq){nq.focus();nq.setSelectionRange(pos,pos);} return; }
  if(t.dataset.multi){
    const k=t.dataset.multi; let arr=esArr(state.form[k]).slice();
    const v=t.value, excl=/^Ningun/i.test(v);
    if(t.checked){
      if(excl) arr=[v];
      else { arr=arr.filter(x=>!/^Ningun/i.test(x)); if(arr.indexOf(v)<0) arr.push(v); }
    } else {
      arr=arr.filter(x=>x!==v);
    }
    state.form[k]=arr; render(); return;
  }
  if(t.dataset.fuste!=null){ const arr=esArr(state.form.medidas_fustes).slice(); arr[+t.dataset.fuste]=t.value; state.form.medidas_fustes=arr; actualizarComputadosWizard(); return; }
  if(t.dataset.k){
    state.form[t.dataset.k]=t.value;
    if(t.dataset.k==="nombre_comun"){
      const esp=ESPECIES.filter(e=>e[0]===t.value)[0];
      state.form.nombre_cientifico = esp ? esp[1] : "";
      const nc=document.querySelector('[data-k="nombre_cientifico"]'); if(nc) nc.value=state.form.nombre_cientifico;
    }
    if(t.dataset.k==="num_fustes"||t.dataset.k==="institucion"||t.dataset.k==="metodo_diam"||t.dataset.k==="consecutivo"){ recomputar(state.form); }
    if(t.dataset.k==="num_fustes"||t.dataset.k==="consecutivo"){ render(); return; }
    actualizarComputadosWizard(); return;
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="instsel"){ state.instFiltro=e.target.value; state.listLimit=30; render(); }
});
function actualizarComputadosWizard(){
  const st=STEPS[state.step]; if(!st) return;
  st.fields.filter(f=>f.t==="computed").forEach(f=>{
    const host=document.querySelector('[data-k="'+f.k+'"]'); if(!host) return;
    host.innerHTML=computedVal(state.form,f.k);
  });
}
function accion(a,ds){
  if(a==="home"){ state.screen="home"; state.editId=null; state.mapSel=null; render(); return; }
  if(a==="list"){ state.filtro=(ds&&ds.filtro)?ds.filtro:"all"; state.listLimit=30; state.screen="list"; render(); return; }
  if(a==="map"){ state.screen="map"; state.mapSel=null; render(); return; }
  if(a==="stats"){ state.screen="stats"; render(); return; }
  if(a==="export"){ state.screen="export"; render(); return; }
  if(a==="nuevo"){ state.form=formVacio(); state.step=0; state.editId=null; state.screen="wizard"; render(); return; }
  if(a==="cancelar"){ if(confirm("¿Descartar este registro sin guardar?")){ state.screen="home"; render(); } return; }
  if(a==="prev"){ if(state.step>0){state.step--; render();} return; }
  if(a==="next"){ if(validarPaso()){ state.step=Math.min(state.step+1,STEPS.length-1); render(); } return; }
  if(a==="gps"){ capturarGPS(); return; }
  if(a==="guardar"){ guardar(); return; }
  if(a==="listmore"){ state.listLimit+=30; render(); return; }
  if(a==="csv"){ descargar("inventario_arboreo.csv",csv(),"text/csv;charset=utf-8"); return; }
  if(a==="geojson"){ descargar("inventario_arboreo.geojson",geojson(),"application/geo+json"); return; }
  if(a==="backup"){ descargar("respaldo_inventario.json",JSON.stringify(records),"application/json"); return; }
  if(a==="copiar"){ navigator.clipboard?.writeText(csv()).then(()=>alert("CSV copiado al portapapeles."),()=>alert("No se pudo copiar.")); return; }
  if(a==="seed"){ if(confirm("¿Restablecer los 128 registros piloto de demostración? Se reemplazan los datos actuales.")){ records=pilotData(); persist(); render(); } return; }
  if(a==="resetall"){ if(confirm("¿Borrar TODOS los registros? Esta acción no se puede deshacer.")){ records=[]; persist(); render(); } return; }
  if(a==="editar"){ const r=records.find(x=>x._id===state.editId); state.form=Object.assign(formVacio(),r); recomputar(state.form); state.form.__fijado=true; state.step=0; state.screen="wizard"; render(); return; }
  if(a==="borrar"){ if(confirm("¿Eliminar este registro?")){ records=records.filter(x=>x._id!==state.editId); persist(); state.screen="home"; state.editId=null; render(); } return; }
}
function validarPaso(){
  const st=STEPS[state.step], f=state.form; const errs=[];
  st.fields.forEach(fld=>{ if(fld.req){ const v=f[fld.k]; if(v==null||v===""||(Array.isArray(v)&&!v.length)) errs.push(fld.l); } });
  const at=num(f.altura_total), af=num(f.altura_fuste), ac=num(f.altura_inicio_copa);
  if(st.id==="ds"){
    if(at!=null&&af!=null&&af>=at) errs.push("la altura del fuste debe ser menor que la altura total");
    if(at!=null&&ac!=null&&ac>=at) errs.push("la altura de inicio de copa debe ser menor que la altura total");
    if(!calcularMedidas(f).valores.length) errs.push("al menos una medida de diámetro");
  }
  if(st.id==="em"){
    if(num(f.pct_permeable)!=null&&(num(f.pct_permeable)<0||num(f.pct_permeable)>100)) errs.push("el porcentaje permeable debe estar entre 0 y 100");
  }
  if(st.id==="ma"){
    const r=nivelRiesgo(f), pr=f.prioridad;
    if((r==="Alto"||r==="Extremo")&&(pr==="mediano"||pr==="rutinaria")) errs.push("para riesgo Alto o Extremo la prioridad no puede ser mediano plazo ni rutinaria");
  }
  if(errs.length){ alert("Complete o corrija: "+errs.join("; ")+"." ); return false; }
  return true;
}
function guardar(){
  if(!validarPaso()) return;
  const f=state.form; recomputar(f);
  const reg=Object.assign({},f);
  delete reg.__fijado;
  if(state.editId){ reg._id=state.editId; records=records.map(x=>x._id===state.editId?reg:x); }
  else { reg._id="r"+Date.now()+"-"+Math.random().toString(36).slice(2,7); records.push(reg); }
  persist();
  const r=nivelRiesgo(reg);
  if(r==="Alto"||r==="Extremo"||num(reg.sitios_larvas)>0) alert("Registro guardado. Recuerde informar al docente el mismo día (riesgo "+r+(num(reg.sitios_larvas)>0?", larvas":"")+").");
  state.screen="detail"; state.editId=reg._id; render();
}
function capturarGPS(){
  if(!navigator.geolocation){ alert("Este dispositivo no ofrece geolocalización. Registre las coordenadas manualmente en observaciones."); return; }
  alert("Buscando señal GPS. Ubíquese junto al fuste, en el lado más despejado.");
  navigator.geolocation.getCurrentPosition(p=>{
    state.form.gps={lat:p.coords.latitude,lng:p.coords.longitude,alt:p.coords.altitude,precision:p.coords.accuracy};
    render();
  }, err=>alert("No se pudo obtener la ubicación: "+err.message), {enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function elegirFoto(k){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=()=>{ const file=inp.files&&inp.files[0]; if(!file) return; const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const max=720; let w=img.width,h=img.height; if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>max){w=Math.round(w*max/h);h=max;}
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      state.form[k]=cv.toDataURL("image/jpeg",0.55); render();
    }; img.src=rd.result; }; rd.readAsDataURL(file); };
  inp.click();
}

/* ---------- 18. Arranque ---------- */
cargarDatos();
render();
window.addEventListener("beforeunload",e=>{ if(state.screen==="wizard"){ e.preventDefault(); e.returnValue=""; } });
</script>
