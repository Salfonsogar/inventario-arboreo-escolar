<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087F5B">
<title>Inventario arbóreo escolar · Protocolo de campo</title>
<style>
:root{
--bg:#DDE8E2;--card:#FFFFFF;--ink:#1F2A25;--muted:#5C6B63;--line:#D9E4DD;
--accent:#087F5B;--accent2:#12966F;--soft:#E8F5EF;--softline:#BEE3D2;
--warn:#7A5300;--warnbg:#FDF1D3;--danger:#A8302F;--dangerbg:#FBE4E4;--info:#1F5E8A;--infobg:#E6F0F7;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}
#frame{width:min(440px,100%);height:min(900px,calc(100dvh - 36px));background:var(--card);border-radius:30px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(31,42,37,.28),0 0 0 10px #1F2A25}
@media (max-width:540px){#stage{padding:0}#frame{border-radius:0;height:100dvh;box-shadow:none;width:100%}}
#app{display:flex;flex-direction:column;height:100%;min-height:0}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--accent);color:#fff;flex:0 0 auto}
.bar h1{font-size:16px;margin:0;font-weight:700;line-height:1.15}
.bar small{display:block;font-weight:400;opacity:.85;font-size:11px}
.bar .sp{margin-left:auto}
.iconbtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:scale(.95)}
.body{flex:1 1 auto;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.foot{flex:0 0 auto;display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:#fff}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled{background:#B9C9C1;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:var(--dangerbg);color:var(--danger)}
.btn.sm{flex:0 0 auto;padding:9px 12px;font-size:12.5px;border-radius:10px}
.hero{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:18px;padding:18px;margin-bottom:14px}
.hero h2{margin:0 0 4px;font-size:19px}
.hero p{margin:0;font-size:12.5px;opacity:.9;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.kpi{background:var(--soft);border:1px solid var(--softline);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:22px;color:var(--accent);line-height:1}
.kpi span{font-size:11.5px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:14.5px}
.card .meta{font-size:12px;color:var(--muted);line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;background:var(--soft);color:var(--accent)}
.chip.w{background:var(--warnbg);color:var(--warn)}
.chip.d{background:var(--dangerbg);color:var(--danger)}
.chip.n{background:#EEF2F0;color:var(--muted)}
.rowbtns{display:flex;gap:8px;margin-top:10px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field .code{font-size:10px;color:var(--accent);font-weight:700;background:var(--soft);border-radius:6px;padding:1px 6px;margin-right:6px}
.field .help{font-size:11.5px;color:var(--muted);line-height:1.45;margin:0 0 6px}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.field textarea{min-height:64px;resize:vertical}
.field .unit{font-size:11px;color:var(--muted);margin-top:4px}
.sev{display:flex;gap:6px}
.sev button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.sev button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sev button.on.s0{background:#8AA79B}.sev button.on.s1{background:#84B84F}.sev button.on.s2{background:#E0A32E}.sev button.on.s3{background:#D9732E}.sev button.on.s4{background:#C0392B}
.checks{display:flex;flex-direction:column;gap:7px}
.check{display:flex;gap:9px;align-items:flex-start;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 11px;cursor:pointer}
.check input{margin-top:2px;width:18px;height:18px;accent-color:var(--accent)}
.toggle{display:flex;gap:8px}
.toggle button{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;color:var(--muted)}
.toggle button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.photo{border:1.5px dashed var(--softline);border-radius:12px;padding:12px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;background:#fbfdfc}
.photo img{max-width:100%;border-radius:10px;display:block;margin:0 auto 8px;max-height:170px}
.gps{background:var(--infobg);border:1px solid #cfe2ef;border-radius:11px;padding:11px;font-size:12.5px;color:var(--info)}
.gps b{font-size:13px}
.computed{background:var(--soft);border:1px solid var(--softline);border-radius:11px;padding:11px;font-size:13px}
.computed b{color:var(--accent);font-size:16px}
.progress{height:5px;background:var(--soft);border-radius:5px;overflow:hidden;margin-bottom:4px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.steplabel{font-size:11.5px;color:var(--muted);margin-bottom:14px;display:flex;justify-content:space-between}
.secthead{font-size:17px;font-weight:800;margin:0 0 4px}
.sectnote{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 16px}
.alert{border-radius:11px;padding:11px;font-size:12.5px;margin-bottom:12px;line-height:1.5}
.alert.w{background:var(--warnbg);color:var(--warn);border:1px solid #efd9a0}
.alert.d{background:var(--dangerbg);color:var(--danger);border:1px solid #f0c4c2}
.alert.i{background:var(--infobg);color:var(--info);border:1px solid #cfe2ef}
.search{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;margin-bottom:12px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:34px 12px;line-height:1.6}
.listnames{font-size:12px;color:var(--muted);line-height:1.6}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.ivae{display:flex;flex-direction:column;gap:8px}
.ivae .line{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 10px;border-radius:9px;background:#fff;border:1px solid var(--line)}
.ivae .line span:last-child{font-weight:700}
.big{font-size:34px;font-weight:800;color:var(--accent);text-align:center;line-height:1}
.muted{color:var(--muted);font-size:11.5px;text-align:center;margin-top:4px}
.stepmenu{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stepmenu button{font-size:11px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--muted);font-family:inherit}
.stepmenu button.cur{background:var(--accent);color:#fff;border-color:var(--accent)}
.qlist .qi{display:flex;gap:8px;font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.qlist .qi:last-child{border:0}
.qlist .ok{color:var(--accent)}.qlist .no{color:var(--danger)}
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="app"></div></div></div>
<noscript>Activa JavaScript para usar la aplicación.</noscript>
<script>
"use strict";
/* =========================================================================
   Inventario arbóreo escolar — aplicación de captura en campo
   Implementa el "Protocolo de campo para el inventario dasométrico,
   fitosanitario y de salud ambiental de los árboles en las instituciones
   educativas del municipio de Valledupar, Cesar" (secciones 8.1 a 8.12 y
   el cálculo del IVAE de la sección 10).
   Funciona sin conexión: guarda los registros en el almacenamiento local.
   ========================================================================= */

/* ---------- 1. Catálogos institucionales ---------- */
const INST = [
  {id:"sj", nombre:"Institución Educativa San José", corto:"San José", prefijo:"IE001", lat:10.463722, lng:-73.253981},
  {id:"la", nombre:"Institución Educativa Los Almendros", corto:"Los Almendros", prefijo:"IE002", lat:10.475910, lng:-73.244120},
  {id:"vv", nombre:"Institución Educativa Villa Verde", corto:"Villa Verde", prefijo:"IE003", lat:10.452180, lng:-73.265400}
];
const ESPECIES = [
  ["Mango","Mangifera indica"],["Cañaguate","Handroanthus chrysanthus"],["Ceiba","Ceiba pentandra"],
  ["Almendro","Terminalia catappa"],["Mamón","Melicoccus bijugatus"],["Oití","Licania tomentosa"],
  ["Roble morado","Tabebuia rosea"],["Totumo","Crescentia cujete"],["Nim","Azadirachta indica"],
  ["Samán","Samanea saman"],["Caracolí","Anacardium excelsum"],["Tamarindo","Tamarindus indica"],
  ["Guácimo","Guazuma ulmifolia"],["Trupillo","Prosopis juliflora"]
];
const SEV = [["0","Ausente"],["1","Leve"],["2","Moderado"],["3","Severo"],["4","Crítico"]];

/* ---------- 2. Diccionario de datos (protocolo, secciones 8.1–8.12) ---------- */
const ub = (...a)=>a.map(x=>Array.isArray(x)?x:[x,x]);
const S = (c,k,l,extra)=>({c,k,l,t:"sev",...extra});
const N = (c,k,l,u,extra)=>({c,k,l,t:"num",u:u||"",...extra});
const T = (c,k,l,extra)=>({c,k,l,t:"text",...extra});
const O = (c,k,l,o,extra)=>({c,k,l,t:"select",o,...extra});
const M = (c,k,l,o,extra)=>({c,k,l,t:"multi",o:Array.isArray(o[0])?o:ub(...o),...extra});
const B = (c,k,l,extra)=>({c,k,l,t:"bool",...extra});

const STEPS = [
{id:"id", code:"8.1", title:"Identificación y registro",
 note:"Identifican cada individuo, lo ubican espacialmente y trazan quién midió. Sin estas variables el resto carece de validez.",
 fields:[
  {c:"ID-01",k:"fecha_registro",l:"Fecha y hora del registro",t:"auto",help:"Registro automático del dispositivo."},
  T("ID-02","evaluador","Evaluador principal",{req:true,help:"Nombres y apellidos completos. Es el universitario líder."}),
  T("ID-02","evaluadores_apoyo","Evaluadores de apoyo",{help:"Estudiantes de colegio y docentes que acompañan."}),
  O("ID-03","institucion","Institución y sede",INST.map(i=>[i.id,i.nombre]),{req:true}),
  T("ID-03","codigo_dane","Código DANE de la sede",{help:"12 dígitos, de la lista oficial del docente."}),
  T("ID-03","sede","Sede o jornada",{}),
  T("ID-04","municipio","Municipio",{def:"Valledupar"}),
  O("ID-04","zona","Zona",[["urbana","Urbana"],["rural","Rural"]]),
  T("ID-04","comuna","Comuna o corregimiento",{}),
  N("ID-05","consecutivo","Consecutivo",{t:"int",help:"Inicia en 1 en cada sede y no se repite. La app lo propone automáticamente."}),
  {c:"ID-06",k:"codigo_arbol",l:"Código del árbol",t:"computed",help:"Lo genera la aplicación: prefijo de la sede + consecutivo (p. ej. IE001-0045)."},
  {c:"ID-07",k:"gps",l:"Coordenadas geográficas",t:"gps",help:"Ubíquese junto al fuste, en el lado más despejado. Precisión ≤ 5 m."},
  {c:"ID-08",k:"foto_general",l:"Fotografía del individuo completo",t:"photo",help:"De la base al ápice, con la placa o un adulto de referencia."},
  {c:"ID-09",k:"foto_fuste",l:"Fotografía del fuste",t:"photo",help:"A unos 2 m, del suelo a la primera ramificación."},
  {c:"ID-10",k:"foto_copa",l:"Fotografía de la copa",t:"photo",help:"Desde abajo o desde un costado, al centro de la copa."},
  {c:"ID-11",k:"foto_base",l:"Fotografía de la base",t:"photo",help:"A 1 m, mostrando el contacto fuste–suelo."}
]},
{id:"tx", code:"8.2", title:"Identificación taxonómica",
 note:"La especie es requisito para la densidad de la madera, las ecuaciones alométricas y los riesgos propios de la especie. Ante duda: «por confirmar» y muestra.",
 fields:[
  O("TX-01","nombre_comun","Nombre común",ESPECIES.map(e=>[e[0],e[0]]),{req:true,help:"Como lo nombra la comunidad."}),
  T("TX-02","nombre_cientifico","Nombre científico",{help:"Género y especie con autor (ej. Mangifera indica L.)."}),
  T("TX-03","familia","Familia botánica",{help:"Ej. Anacardiaceae."}),
  O("TX-04","origen","Origen de la especie",[["nativa","Nativa"],["exotica","Exótica"],["invasora","Invasora"],["nose","No se sabe"]]),
  O("TX-05","confianza_id","Confianza de la identificación",[["confirmada","Confirmada"],["genero","Solo a género"],["por_confirmar","Por confirmar"]]),
  B("TX-06","muestra_botanica","¿Se colectó muestra botánica?",{}),
  T("TX-06","num_colecta","Número de colecta",{help:"Iniciales + consecutivo (ej. JP-012)."}),
  B("TX-06","muestra_fertil","¿La muestra es fértil (flores o frutos)?",{})
]},
{id:"ds", code:"8.3", title:"Variables dasométricas",
 note:"Base del área basal, biomasa, carbono y CO₂. Un error aquí se propaga a todos los resultados.",
 fields:[
  O("DS-01","metodo_diam","Instrumento para el diámetro",[["CAP","CAP (cinta métrica)"],["DAP","DAP (cinta diamétrica)"]],{req:true,help:"La app convierte CAP a DAP (DAP = CAP ÷ 3,1416)."}),
  N("DS-02","num_fustes","Número de fustes",{t:"int",min:1,max:8,def:"1",help:"Troncos separados a 1,30 m."}),
  M("DS-03","condicion_dap","Condición en el punto de medición",["Bifurcado","Inclinado","Contrafuertes","Pendiente","Deformidad","Ninguna"],{help:"Marque todas las que apliquen (PE-01)."}),
  N("DS-04","altura_medicion","Altura de medición","m",{def:"1.30",step:"0.01",help:"1,30 m por defecto."}),
  {c:"DS-05",k:"medidas_fustes",l:"Medida de cada fuste (CAP o DAP)",t:"fustes",u:"cm",help:"Una medida por fuste con un decimal (ej. 87,5)."},
  N("DS-06","altura_total","Altura total","m",{req:true,step:"0.1",help:"Del suelo al ápice (PE-02)."}),
  N("DS-07","altura_fuste","Altura del fuste","m",{step:"0.1",help:"Del suelo a la primera ramificación principal."}),
  N("DS-08","altura_inicio_copa","Altura de inicio de copa","m",{step:"0.1",help:"A la rama viva más baja."}),
  N("DS-09a","copa_ns","Diámetro de copa N–S","m",{step:"0.1",help:"PE-03."}),
  N("DS-09b","copa_eo","Diámetro de copa E–O","m",{step:"0.1",help:"PE-03."}),
  O("DS-10","forma_copa","Forma de copa",["Globosa","Aparasolada","Columnar","Cónica","Ovoide","Irregular","Palmiforme"]),
  N("DS-11","inclinacion_grados","Inclinación","°",{min:0,max:90,step:"1",help:"Fuste recto = 0."}),
  O("DS-12","inclinacion_dir","Dirección de la inclinación",["N","NE","E","SE","S","SO","O","NO"]),
  O("DS-13","inclinacion_tipo","Tipo de inclinación",[["reciente","Reciente"],["corregida","Corregida"],["natural","Natural"]]),
  O("DS-14","estado_desarrollo","Estado de desarrollo",[["brinzal","Brinzal (< 1,5 m)"],["juvenil","Juvenil"],["maduro","Maduro"],["senescente","Senescente"]],{req:true}),
  O("DS-15","origen_individuo","Origen del individuo",[["plantado","Plantado"],["natural","Natural"],["nose","No se sabe"]])
]},
{id:"em", code:"8.4", title:"Emplazamiento y conflictos",
 note:"Describe el sitio de crecimiento y su relación con las construcciones y servicios de la sede.",
 fields:[
  O("EM-01","ubicacion_predio","Ubicación dentro del predio",["Patio de recreo","Zona verde","Cancha","Parqueadero","Junto a aulas","Perímetro","Andén","Huerta","Entrada","Otro"],{req:true}),
  O("EM-02","superficie_base","Tipo de superficie en la base",["Zona verde","Alcorque","Pavimento","Suelo compactado","Mixta"]),
  N("EM-03a","alcorque_largo","Alcorque: largo","m",{step:"0.01"}),
  N("EM-03b","alcorque_ancho","Alcorque: ancho / diámetro","m",{step:"0.01"}),
  N("EM-04","pct_permeable","Suelo permeable bajo la copa","%",{min:0,max:100,step:"5"}),
  N("EM-05","dist_edificacion","Distancia a la edificación más cercana","m",{step:"0.1"}),
  N("EM-06","dist_cerramiento","Distancia al cerramiento","m",{step:"0.1"}),
  N("EM-07","dist_arbol_vecino","Distancia al árbol vecino","m",{step:"0.1"}),
  M("EM-08","conflicto_redes","Conflicto con redes",["Media tensión < 2 m","Baja tensión < 2 m","Acueducto < 3 m","Alcantarillado < 3 m","Gas < 3 m","Ninguno"]),
  M("EM-09","danos_infra","Daños a la infraestructura",["Pisos o andenes levantados","Grietas hacia el árbol","Ramas sobre techos","Canales obstruidos","Rejas deformadas","Ninguno"]),
  M("EM-10","conflicto_funcional","Conflicto funcional",["Visibilidad en entradas o cruces","Paso obstruido","Ruta de evacuación","Iluminación","Ninguno"])
]},
{id:"fr", code:"8.5.1", title:"Fitosanitario · Raíz y cuello",
 note:"Revisión con guantes, retirando con cuidado la hojarasca. La severidad se asigna rodeando el individuo: 0 ausente · 4 crítico (> 3/4 de la parte afectada).",
 fields:[
  S("FR-01","raices_expuestas","Raíces expuestas",{help:"Raíces gruesas descubiertas por erosión o pisoteo."}),
  S("FR-02","raices_danadas","Raíces dañadas",{help:"Cortadas, partidas o descortezadas."}),
  S("FR-03","raices_estranguladoras","Raíces estranguladoras",{help:"Raíz que rodea y comprime el fuste."}),
  S("FR-04","pudricion_cuello","Pudrición del cuello",{help:"Madera blanda; sonido hueco al golpe con mazo."}),
  S("FR-05","hongos_base","Hongos en la base",{help:"Cuerpos fructíferos; indican pudrición interna."}),
  S("FR-06","levantamiento_suelo","Levantamiento del suelo",{help:"Grietas o montículos: indicador de volcamiento."}),
  S("FR-07","compactacion","Compactación o relleno",{help:"Suelo endurecido o tierra sobre el cuello."}),
  S("FR-08","dano_mecanico_base","Daño mecánico en la base",{help:"Golpes de guadaña, vehículos o bicicletas."})
]},
{id:"ff", code:"8.5.2", title:"Fitosanitario · Fuste",
 note:"Del suelo a la primera ramificación, rodeándolo completamente y golpeando con el mazo cada 20 cm.",
 fields:[
  S("FF-01","cavidades","Cavidades",{help:"Huecos que penetran la madera. No introduzca la mano."}),
  N("FF-02","pct_pared_residual","Pared residual","%",{min:0,max:100,help:"Menos del 30 % indica riesgo alto."}),
  N("FF-03","diam_cavidad_cm","Diámetro de la cavidad","cm",{step:"0.1"}),
  S("FF-04","heridas","Heridas / chancros",{help:"Zonas sin corteza o con corteza muerta hundida."}),
  S("FF-05","grietas","Grietas",{help:"Fisuras longitudinales o corteza incluida."}),
  S("FF-06","exudados","Exudados",{help:"Goma o resina, o líquido oscuro y maloliente."}),
  S("FF-07","pudricion_fuste","Pudrición del fuste",{help:"Madera blanda o fibrosa; hongos en repisa."}),
  S("FF-08","termitas","Comején (termitas)",{help:"Túneles de barro o comejeneras."}),
  S("FF-09","perforadores","Perforadores",{help:"Orificios redondos y aserrín fino."}),
  M("FF-10","elementos_extranos","Elementos extraños",["Clavos","Alambres","Avisos","Mangueras","Pintura o cal","Ninguno"])
]},
{id:"fe", code:"8.5.3", title:"Fitosanitario · Ramas y estructura",
 note:"Revisión con binoculares desde varios puntos, sin ubicarse bajo ramas colgantes.",
 fields:[
  S("FE-01","ramas_muertas","Ramas muertas",{help:"Porción de copa con ramas secas sin hojas vivas."}),
  S("FE-02","ramas_rotas","Ramas rotas o colgantes",{help:"Extremo colgando, astilladas o atrapadas."}),
  N("FE-03","diam_rama_muerta_cm","Diámetro de la rama muerta mayor","cm",{step:"0.1",help:"Una botella ≈ 7 cm."}),
  B("FE-04","ramas_sobre_transito","¿Ramas muertas o rotas sobre zonas de tránsito?",{}),
  B("FE-05","codominancia","¿Codominancia (unión en V)?",{}),
  B("FE-06","ramas_sobreextendidas","¿Ramas sobreextendidas?",{}),
  B("FE-07","desbalance_copa","¿Desbalance de copa?",{})
]},
{id:"fc", code:"8.5.4", title:"Fitosanitario · Copa y follaje",

const KEY = "iae_registros_v2";
const CONFIG = {DT_MAX:15, AREA_MAX:300};
let records = [];
try{ records = JSON.parse(localStorage.getItem(KEY))||[] }catch(e){ records=[] }

/* ---------- 4. Utilidades ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v=>{ const n=parseFloat(String(v==null?"":v).replace(",",".")); return isNaN(n)?null:n };
const r1 = v=> v==null?null:Math.round(v*10)/10;
const r2 = v=> v==null?null:Math.round(v*100)/100;
const f1 = v=> v==null?"—":r1(v).toFixed(1).replace(".",",");
const f2 = v=> v==null?"—":r2(v).toFixed(2).replace(".",",");
const inst = id=>INST.find(i=>i.id===id);
const esArr = a=>Array.isArray(a)?a:[];
const fmtFecha = d=>d.toLocaleString("es-CO",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
function escSel(f,val){
  return f.o.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return '<option value="'+esc(v)+'"'+(String(val)===String(v)?" selected":"")+">"+esc(l)+"</option>"}).join("");
}

/* ---------- 5. Cálculos derivados ---------- */
function calcularMedidas(f){
  const es = f.metodo_diam==="CAP" ? "CAP" : "DAP";
  const arr = esArr(f.medidas_fustes).map(num).filter(x=>x!=null);
  // DAP por fuste
  const daps = arr.map(x=> es==="CAP" ? x/Math.PI : x);
  const dapEq = daps.length ? Math.sqrt(daps.reduce((a,b)=>a+b*b,0)) : null;
  return {metodo:es, valores:arr, dap_por_fuste:daps, dap_equivalente:dapEq, dap_total:es==="CAP"? (r1(arr.reduce((a,b)=>a+b,0)/Math.PI)) : r1(arr.reduce((a,b)=>a+b,0))};
}
function areaCopa(f){ const a=num(f.copa_ns), b=num(f.copa_eo); if(a==null||b==null) return null; return r1(Math.PI*a*b/4) }
function deltaT(f){
  const sol=[f.tsol1,f.tsol2,f.tsol3].map(num).filter(x=>x!=null);
  const som=[f.tsombra1,f.tsombra2,f.tsombra3].map(num).filter(x=>x!=null);
  if(!sol.length||!som.length) return {dsol:null,dsom:null,dt:null};
  const msol=sol.reduce((a,b)=>a+b,0)/sol.length, msom=som.reduce((a,b)=>a+b,0)/som.length;
  return {dsol:r1(msol), dsom:r1(msom), dt:r1(msol-msom)};
}
function heatIndex(t,hr){
  if(t==null||hr==null) return null;
  const T=t*9/5+32, R=hr;
  let hi=-42.379+2.04901523*T+10.14333127*R-0.22475541*T*R-0.00683783*T*T-0.05481717*R*R+0.00122874*T*T*R+0.00085282*T*R*R-0.00000199*T*T*R*R;
  if(R<13 && T>=80 && T<=112) hi -= ((13-R)/4)*Math.sqrt((17-Math.abs(T-95))/17);
  if(R>85 && T>=80 && T<=87) hi += ((R-85)/10)*((87-T)/5);
  return r1((hi-32)*5/9);
}
const M19 = {
  inminente:["Improbable","Algo probable","Probable","Muy probable"],
  probable:["Improbable","Improbable","Algo probable","Probable"],
  posible:["Improbable","Improbable","Improbable","Algo probable"],
  improbable:["Improbable","Improbable","Improbable","Improbable"]
};
const M20 = {
  "Muy probable":["Bajo","Moderado","Alto","Extremo"],
  "Probable":["Bajo","Moderado","Alto","Alto"],
  "Algo probable":["Bajo","Bajo","Moderado","Moderado"],
  "Improbable":["Bajo","Bajo","Bajo","Bajo"]
};
const IMP = {muy_baja:0, baja:1, media:2, alta:3};
const CON = {despreciables:0, menores:1, significativas:2, severas:3};
function nivelRiesgo(f){
  const pf=M19[f.prob_falla], im=IMP[f.prob_impacto], co=CON[f.consecuencias];
  if(pf==null||im==null||co==null) return null;
  const pi = pf[im];
  return M20[pi][co];
}
function infiltracionOK(f){ return !!f.infiltracion_na || num(f.infiltracion_s)!=null }
function ivae(f){
  const dt=deltaT(f).dt, area=areaCopa(f);
  const dtn = dt==null?null:Math.max(0,Math.min(1,dt/CONFIG.DT_MAX));
  const arn = area==null?null:Math.max(0,Math.min(1,area/CONFIG.AREA_MAX));
  const recn = num(f.reconocen_nombre)==null?null:num(f.reconocen_nombre)/5;
  const rie = {Bajo:0,Moderado:.33,Alto:.67,Extremo:1}[nivelRiesgo(f)];
  const est = {sano:0,leve:.25,moderado:.5,severo:.75,muerto:1}[f.estado_sanitario];
  const sa1=num(f.sitios_agua), sa2=num(f.sitios_larvas);
  const cri = (sa1==null)?null:(sa1===0?0:(sa2>0?1:.5));
  const sistemas = esArr(f.sistemas_agua).filter(x=>x!=="Ninguno").length;
  const agu = sistemas/4;
  const comps=[
    ["Enfriamiento (ΔT)", .20, dtn, "b"],
    ["Sombra útil en recreo", .20, arn, "b"],
    ["Reconocimiento", .10, recn, "b"],
    ["Riesgo", .20, rie, "p"],
    ["Estado sanitario", .15, est, "p"],
    ["Criaderos de mosquitos", .10, cri, "p"],
    ["Afectación a sistemas de agua", .05, agu, "p"]
  ];
  let benef=0, prob=0, faltan=0, out=[];
  comps.forEach(([l,w,v,tipo])=>{
    if(v==null){ faltan++; out.push({l,w,v:null,tipo}); return; }
    const aporte=w*v; if(tipo==="b") benef+=aporte; else prob+=aporte;
    out.push({l,w,v,tipo,aporte});
  });
  return {ivae:r2(benef-prob), benef:r2(benef), prob:r2(prob), detalle:out, faltan};
}
function estadoCategoria(f){
  const e=f.estado_sanitario;
  if(e==="sano") return {t:"Sano",cls:"n"};
  if(e==="leve"||e==="moderado") return {t:"En riesgo",cls:"w"};
  if(e==="severo"||e==="muerto") return {t:"Crítico",cls:"d"};
  return {t:"Sin clasificar",cls:"n"};
}
function calidad(f){
  const rows=[];
  const add=(ok,txt)=>rows.push([!!ok,txt]);
  add(f.codigo_arbol,"El código del árbol está generado y coincide con la marcación.");
  add(f.gps && num(f.gps.precision)!=null && num(f.gps.precision)<=5,"Precisión del GPS ≤ 5 m (o justificada en observaciones).");
  add(f.foto_general&&f.foto_fuste&&f.foto_copa&&f.foto_base,"Están las cuatro fotografías básicas.");
  const m=calcularMedidas(f);
  add(m.valores.length>=1,"Se registró al menos una medida de diámetro.");
  const at=num(f.altura_total), af=num(f.altura_fuste), ac=num(f.altura_inicio_copa);
  add(at!=null && (af==null||af<at) && (ac==null||ac<at),"Altura de fuste e inicio de copa menores que la altura total.");
  add(esArr(f.medidas_fustes).length>=num(f.num_fustes||1),"Hay una medida por cada fuste.");
  const dt=deltaT(f).dt; add(dt!=null,"Se registraron las temperaturas de sol y de sombra (ΔT).");
  add(areaCopa(f)!=null,"Se registraron los diámetros de copa y la sombra útil.");
  add(num(f.sitios_agua)!=null && num(f.sitios_larvas)!=null,"Se revisaron los sitios con agua y con larvas.");
  add(esArr(f.sistemas_agua).length>0,"Se revisaron los cuatro grupos de sistemas de agua.");
  add(infiltracionOK(f) && num(f.dias_ultima_lluvia)!=null,"La infiltración registra tiempo y días desde la última lluvia.");
  add(f.estado_sanitario!=null,"El estado sanitario general está asignado.");
  add(nivelRiesgo(f)!=null,"La evaluación de riesgo está completa.");
  add(ivae(f).faltan===0,"Las variables que alimentan el IVAE están completas.");
  return rows;
}

function formVacio(){
  const f={}; STEPS.forEach(s=>s.fields.forEach(fld=>{ if(fld.t!=="computed"&&fld.t!=="auto"){ f[fld.k] = fld.t==="bool"?null : fld.t==="multi"?[] : (fld.def||""); } }));
  f.fecha_registro = fmtFecha(new Date());
  f.gps = {lat:null,lng:null,alt:null,precision:null};
  f.medidas_fustes = [];
  return f;
}
function siguienteConsecutivo(instId){
  const p = inst(instId)?.prefijo || "IE";
  const usados = records.filter(r=>r.institucion===instId).map(r=>num(r.consecutivo)||0);
  const n = (usados.length?Math.max(...usados):0)+1;
  return {consecutivo:String(n), codigo_arbol:p+"-"+String(n).padStart(4,"0")};
}
function recomputar(f){
  const instId=f.institucion;
  if(instId && !f.__fijado){
    const sc=siguienteConsecutivo(instId);
    if(!f.consecutivo) f.consecutivo=sc.consecutivo;
    f.codigo_arbol=(inst(instId)?.prefijo||"IE")+"-"+String(num(f.consecutivo)||sc.consecutivo).padStart(4,"0");
  }
  const nf=Math.max(1,num(f.num_fustes)||1);
  const arr=esArr(f.medidas_fustes).slice(0,nf);
  while(arr.length<nf) arr.push("");
  f.medidas_fustes=arr;
}

function fieldHTML(fld,f){
  const val=f[fld.k];
  const code='<span class="code">'+esc(fld.c)+'</span>';
  const help=fld.help?'<p class="help">'+esc(fld.help)+'</p>':'';
  const lbl='<label>'+code+esc(fld.l)+'</label>';
  const u=fld.u?'<div class="unit">Unidad: '+esc(fld.u)+'</div>':'';
  const req=fld.req?' <span style="color:#C0392B">*</span>':'';
  const L=lbl.replace('</label>',req+'</label>');
  if(fld.t==="text") return '<div class="field">'+L+help+'<input type="text" data-k="'+esc(fld.k)+'" value="'+esc(val)+'"></div>';
  if(fld.t==="num"||fld.t==="int") return '<div class="field">'+L+help+'<input type="number" inputmode="'+(fld.t==="int"?"numeric":"decimal")+'" data-k="'+esc(fld.k)+'" value="'+esc(val)+'"'+(fld.min!=null?' min="'+fld.min+'"':'')+(fld.max!=null?' max="'+fld.max+'"':'')+(fld.step?' step="'+fld.step+'"':'')+'>'+u+'</div>';
  if(fld.t==="time") return '<div class="field">'+L+help+'<input type="time" data-k="'+esc(fld.k)+'" value="'+esc(val)+'"></div>';
  if(fld.t==="select") return '<div class="field">'+L+help+'<select data-k="'+esc(fld.k)+'"><option value="">— Seleccione —</option>'+escSel(fld,val)+'</select></div>';
  if(fld.t==="multi"){
    const arr=esArr(val);
    return '<div class="field">'+L+help+'<div class="checks">'+fld.o.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return '<label class="check"><input type="checkbox" data-multi="'+esc(fld.k)+'" value="'+esc(v)+'"'+(arr.indexOf(v)>=0?" checked":"")+'><span>'+esc(l)+'</span></label>'}).join("")+'</div></div>';
  }
  if(fld.t==="bool"){
    return '<div class="field">'+L+help+'<div class="toggle"><button type="button" data-bool="'+esc(fld.k)+'" data-v="1" class="'+(val===true?"on":"")+'">Sí</button><button type="button" data-bool="'+esc(fld.k)+'" data-v="0" class="'+(val===false?"on":"")+'">No</button></div></div>';
  }
  if(fld.t==="sev"){
    return '<div class="field">'+L+help+'<div class="sev">'+SEV.map(s=>'<button type="button" data-sev="'+esc(fld.k)+'" data-v="'+s[0]+'" class="'+(String(val)===s[0]?"on s"+s[0]:"")+'">'+s[1]+'</button>').join("")+'</div></div>';
  }
  if(fld.t==="gps"){
    const g=f.gps||{};
    const txt = g.lat!=null ? ('<b>'+f2(g.lat)+', '+f2(g.lng)+'</b><br>Precisión ±'+f1(g.precision)+' m'+(g.alt!=null?' · Altitud '+f1(g.alt)+' m':'')) : "Sin capturar.";
    return '<div class="field">'+L+help+'<div class="gps">'+txt+'</div><div style="height:8px"></div><button class="btn ghost" data-a="gps">Capturar coordenadas GPS</button></div>';
  }
  if(fld.t==="photo"){
    return '<div class="field">'+L+help+'<div class="photo" data-photo="'+esc(fld.k)+'">'+(val?'<img src="'+val+'"><span>Cambiar fotografía</span>':"Tocar para tomar o adjuntar la fotografía")+'</div></div>';
  }
  if(fld.t==="fustes"){
    const nf=Math.max(1,esArr(f.medidas_fustes).length);
    let rows=""; for(let i=0;i<nf;i++){ rows+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="mono" style="width:80px">Fuste '+(i+1)+'</span><input type="number" step="0.1" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;font-family:inherit" data-fuste="'+i+'" value="'+esc(esArr(f.medidas_fustes)[i]||"")+'"></div>'; }
    const m=calcularMedidas(f);
    return '<div class="field">'+L+help+'<div style="font-size:12px;color:var(--muted);margin-bottom:8px">Se registra '+(f.metodo_diam==="CAP"?"CAP":"DAP")+' de cada tronco. Ajuste el número de fustes en DS-02.</div>'+rows+
      '<div class="computed">DAP equivalente: <b>'+f1(m.dap_equivalente)+'</b> cm</div>'+u+'</div>';
  }
  if(fld.t==="auto"){
    return '<div class="field">'+L+help+'<div class="computed">'+esc(val)+'</div></div>';
  }
  if(fld.t==="computed"){
    let v="—";
    if(fld.k==="codigo_arbol") v=esc(f.codigo_arbol||"se asigna al elegir la institución");
    else if(fld.k==="nivel_riesgo") v=esc(nivelRiesgo(f)||"complete RG-03, RG-06 y RG-07");
    else if(fld.k==="delta_t") v=f1(deltaT(f).dt)+" °C";
    else if(fld.k==="indice_calor") v=f1(heatIndex(num(f.t_aire_sol),num(f.hr_sol)))+" °C (al sol)";
    else if(fld.k==="area_sombra") v=f1(areaCopa(f)!=null? (()=>{const a=num(f.sombra_largo),b=num(f.sombra_ancho);return (a!=null&&b!=null)?Math.PI*a*b/4:null})():null)+" m²";
    else if(fld.k==="ocup_prom"){const a=[f.ocupacion_1,f.ocupacion_2,f.ocupacion_3].map(num).filter(x=>x!=null); v=a.length?(f1(a.reduce((x,y)=>x+y,0)/a.length)+" (máx "+Math.max(...a)+")"):"—";}
    return '<div class="field">'+L+help+'<div class="computed">'+v+'</div></div>';
  }
  return "";
}

/* ---------- 8. Exportación ---------- */
function camposPlanos(){
  const cols=[];
  STEPS.forEach(s=>s.fields.forEach(f=>{ if(f.t!=="computed"&&f.t!=="auto"&&f.t!=="photo"&&f.t!=="gps"&&f.k!=="medidas_fustes") cols.push([s.code+" "+f.c,f.k]); }));
  cols.push(["ID-07 Latitud","__lat"],["ID-07 Longitud","__lng"],["ID-07 Precisión (m)","__prec"]);
  cols.push(["DS-05 DAP equivalente (cm)","__dap"],["DS-09 Área de copa (m²)","__areacopa"]);
  cols.push(["CT-01 ΔT (°C)","__dt"],["CT-04 Índice de calor (°C)","__ic"],["CT-05 Área de sombra (m²)","__areasombra"]);
  cols.push(["RG-08 Nivel de riesgo","__riesgo"],["FG-02 Categoría","__categoria"],["IVAE","__ivae"],["Calidad (cumple/total)","__calidad"]);
  return cols;
}
function valorPlano(r,k){
  if(k==="__lat") return r.gps&&r.gps.lat!=null?r.gps.lat:"";
  if(k==="__lng") return r.gps&&r.gps.lng!=null?r.gps.lng:"";
  if(k==="__prec") return r.gps&&r.gps.precision!=null?r.gps.precision:"";
  if(k==="__dap") return r1(calcularMedidas(r).dap_equivalente)??"";
  if(k==="__areacopa") return f1n(areaCopa(r));
  if(k==="__dt") return f1n(deltaT(r).dt);
  if(k==="__ic") return f1n(heatIndex(num(r.t_aire_sol),num(r.hr_sol)));
  if(k==="__areasombra"){const a=num(r.sombra_largo),b=num(r.sombra_ancho);return (a!=null&&b!=null)?r1(Math.PI*a*b/4):"";}
  if(k==="__riesgo") return nivelRiesgo(r)||"";
  if(k==="__categoria") return estadoCategoria(r).t;
  if(k==="__ivae") return r2(ivae(r).ivae)??"";
  if(k==="__calidad"){const c=calidad(r);return (c.filter(x=>x[0]).length)+"/"+c.length;}
  const v=r[k]; if(Array.isArray(v)) return v.join("; ");
  if(v===true) return "Sí"; if(v===false) return "No"; return v==null?"":v;
}
function f1n(v){return v==null?"":r1(v)}
function csv(){
  const cols=camposPlanos();
  const head=cols.map(c=>'"'+c[0].replace(/"/g,'""')+'"').join(",");
  const body=records.map(r=>cols.map(c=>{let v=String(valorPlano(r,c[1]));return '"'+v.replace(/"/g,'""')+'"'}).join(",")).join("\r\n");
  return head+"\r\n"+body;
}
function geojson(){
  return JSON.stringify({type:"FeatureCollection",features:records.filter(r=>r.gps&&r.gps.lat!=null).map(r=>({type:"Feature",geometry:{type:"Point",coordinates:[r.gps.lng,r.gps.lat]},properties:{codigo:r.codigo_arbol,especie:r.nombre_comun,cientifico:r.nombre_cientifico,institucion:inst(r.institucion)?.nombre,dap:r1(calcularMedidas(r).dap_equivalente),altura:num(r.altura_total),riesgo:nivelRiesgo(r),estado:estadoCategoria(r).t,ivae:r2(ivae(r).ivae)}}))},null,2);
}
function descargar(nombre,contenido,tipo){
  const blob=new Blob([contenido],{type:tipo});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombre; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

  const t=e.target;
  if(t.id==="q"){ state.query=t.value; const pos=t.selectionStart; render(); const nq=$("#q"); if(nq){nq.focus();nq.setSelectionRange(pos,pos);} return; }
  if(t.dataset.multi){ const k=t.dataset.multi, arr=esArr(state.form[k]).slice(); const i=arr.indexOf(t.value); if(t.checked&&i<0)arr.push(t.value); if(!t.checked&&i>=0)arr.splice(i,1); state.form[k]=arr; return; }
  if(t.dataset.fuste!=null){ const arr=esArr(state.form.medidas_fustes).slice(); arr[+t.dataset.fuste]=t.value; state.form.medidas_fustes=arr; actualizarComputadosWizard(); return; }
  if(t.dataset.k){
    state.form[t.dataset.k]=t.value;
    if(t.dataset.k==="num_fustes"||t.dataset.k==="institucion"||t.dataset.k==="metodo_diam"||t.dataset.k==="consecutivo"){ recomputar(state.form); }
    if(t.dataset.k==="num_fustes"||t.dataset.k==="consecutivo"){ render(); return; }
    actualizarComputadosWizard(); return;
  }
});
function actualizarComputadosWizard(){
  // Actualiza solo los bloques calculados visibles sin re-render completo (evita perder el foco).
  const st=STEPS[state.step]; if(!st) return;
  st.fields.filter(f=>f.t==="computed").forEach(f=>{
    const host=document.querySelector('[data-k="'+f.k+'"]'); if(!host) return;
    let v="—"; const fm=state.form;
    if(f.k==="codigo_arbol") v=esc(fm.codigo_arbol||"se asigna al elegir la institución");
    else if(f.k==="nivel_riesgo") v=esc(nivelRiesgo(fm)||"complete RG-03, RG-06 y RG-07");
    else if(f.k==="delta_t") v=f1(deltaT(fm).dt)+" °C";
    else if(f.k==="indice_calor") v=f1(heatIndex(num(fm.t_aire_sol),num(fm.hr_sol)))+" °C (al sol)";
    else if(f.k==="area_sombra"){const a=num(fm.sombra_largo),b=num(fm.sombra_ancho); v=(a!=null&&b!=null)?f1(Math.PI*a*b/4)+" m²":"—";}
    else if(f.k==="ocup_prom"){const arr=[fm.ocupacion_1,fm.ocupacion_2,fm.ocupacion_3].map(num).filter(x=>x!=null); v=arr.length?(f1(arr.reduce((x,y)=>x+y,0)/arr.length)+" (máx "+Math.max(...arr)+")"):"—";}
    host.innerHTML=v;
  });
}
function accion(a){
  if(a==="home"){ state.screen="home"; state.editId=null; render(); return; }
  if(a==="nuevo"){ state.form=formVacio(); state.step=0; state.editId=null; state.screen="wizard"; render(); return; }
  if(a==="cancelar"){ if(confirm("¿Descartar este registro sin guardar?")){ state.screen="home"; render(); } return; }
  if(a==="prev"){ if(state.step>0){state.step--; render();} return; }
  if(a==="next"){ if(validarPaso()){ state.step=Math.min(state.step+1,STEPS.length-1); render(); } return; }
  if(a==="gps"){ capturarGPS(); return; }
  if(a==="guardar"){ guardar(); return; }
  if(a==="export"){ state.screen="export"; render(); return; }
  if(a==="csv"){ descargar("inventario_arboreo.csv",csv(),"text/csv;charset=utf-8"); return; }
  if(a==="geojson"){ descargar("inventario_arboreo.geojson",geojson(),"application/geo+json"); return; }
  if(a==="backup"){ descargar("respaldo_inventario.json",JSON.stringify(records),"application/json"); return; }
  if(a==="copiar"){ navigator.clipboard?.writeText(csv()).then(()=>alert("CSV copiado al portapapeles."),()=>alert("No se pudo copiar.")); return; }
  if(a==="editar"){ const r=records.find(x=>x._id===state.editId); state.form=Object.assign(formVacio(),r); recomputar(state.form); state.form.__fijado=true; state.step=0; state.screen="wizard"; render(); return; }
  if(a==="borrar"){ if(confirm("¿Eliminar este registro?")){ records=records.filter(x=>x._id!==state.editId); persist(); state.screen="home"; state.editId=null; render(); } return; }
}
function validarPaso(){
  const st=STEPS[state.step], f=state.form; const errs=[];
  st.fields.forEach(fld=>{ if(fld.req){ const v=f[fld.k]; if(v==null||v===""||(Array.isArray(v)&&!v.length)) errs.push(fld.l); } });
  const at=num(f.altura_total), af=num(f.altura_fuste), ac=num(f.altura_inicio_copa);
  if(st.id==="ds"){
    if(at!=null&&af!=null&&af>=at) errs.push("la altura del fuste debe ser menor que la altura total");
    if(at!=null&&ac!=null&&ac>=at) errs.push("la altura de inicio de copa debe ser menor que la altura total");
    if(!calcularMedidas(f).valores.length) errs.push("al menos una medida de diámetro");
  }
  if(st.id==="em"){
    if(num(f.pct_permeable)!=null&&(num(f.pct_permeable)<0||num(f.pct_permeable)>100)) errs.push("el porcentaje permeable debe estar entre 0 y 100");
  }
  if(st.id==="ma"){
    const r=nivelRiesgo(f), pr=f.prioridad;
    if((r==="Alto"||r==="Extremo")&&(pr==="mediano"||pr==="rutinaria")) errs.push("para riesgo Alto o Extremo la prioridad no puede ser mediano plazo ni rutinaria");
  }
  if(errs.length){ alert("Complete o corrija: "+errs.join("; ")+"." ); return false; }
  return true;
}
function guardar(){
  if(!validarPaso()) return;
  const f=state.form; recomputar(f);
  if(state.form.__fijado && state.editId){ /* edición */ }
  const reg=Object.assign({},f);
  delete reg.__fijado;
  if(state.editId){ reg._id=state.editId; records=records.map(x=>x._id===state.editId?reg:x); }
  else { reg._id="r"+Date.now()+"-"+Math.random().toString(36).slice(2,7); records.push(reg); }
  persist();
  const r=nivelRiesgo(reg);
  if(r==="Alto"||r==="Extremo"||num(reg.sitios_larvas)>0) alert("Registro guardado. Recuerde informar al docente el mismo día (riesgo "+r+(num(reg.sitios_larvas)>0?", larvas":"")+").");
  state.screen="detail"; state.editId=reg._id; render();
}
function capturarGPS(){
  if(!navigator.geolocation){ alert("Este dispositivo no ofrece geolocalización. Registre las coordenadas manualmente en observaciones."); return; }
  alert("Buscando señal GPS. Ubíquese junto al fuste, en el lado más despejado.");
  navigator.geolocation.getCurrentPosition(p=>{
    state.form.gps={lat:p.coords.latitude,lng:p.coords.longitude,alt:p.coords.altitude,precision:p.coords.accuracy};
    render();
  }, err=>alert("No se pudo obtener la ubicación: "+err.message), {enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function elegirFoto(k){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
  inp.onchange=()=>{ const file=inp.files&&inp.files[0]; if(!file) return; const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{
      const max=720; let w=img.width,h=img.height; if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>max){w=Math.round(w*max/h);h=max;}
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h);
      state.form[k]=cv.toDataURL("image/jpeg",0.55); render();
    }; img.src=rd.result; }; rd.readAsDataURL(file); };
  inp.click();
}

/* ---------- 10. Inicio ---------- */
recomputar(formVacio());
render();
window.addEventListener("beforeunload",e=>{ if(state.screen==="wizard"){ e.preventDefault(); e.returnValue=""; } });
</script>
